version: "3.9"

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: videodb
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    ports:
      - "6379:6379"

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - ./data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - web
      - api
      - minio
    restart: unless-stopped

  api:
    build:
      context: ../app/api
      dockerfile: dockerfile.api
      args:
        NODE_ENV: production
    env_file:
      - ../app/api/.env
    secrets:
      - google_client_id
      - google_client_secret
      - nextauth_secret
    depends_on:
      - postgres
      - redis
      - minio
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  web:
    build:
      context: ../app/web
      dockerfile: dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8080/api"
    env_file:
      - ../app/web/.env.local
    secrets:
      - google_client_id
      - google_client_secret
      - nextauth_secret
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  worker:
    build:
      context: ../app/worker
      dockerfile: dockerfile.worker
    env_file:
      - ../app/worker/.env
    volumes:
      - ./data/worker_tmp:/tmp
    depends_on:
      - redis
      - minio
      - postgres

secrets:
  google_client_id:
    file: ./secrets/google_client_id
  google_client_secret:
    file: ./secrets/google_client_secret
  nextauth_secret:
    file: ./secrets/nextauth_secret
